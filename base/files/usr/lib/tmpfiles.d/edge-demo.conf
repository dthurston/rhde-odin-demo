# Operator home + kiosk wiring. Re-applied every boot, so after a role
# switch the kiosk script points at the new image's launcher.
d  /var/home/operator                       0700 operator operator -
d  /var/home/operator/.local                0755 operator operator -
d  /var/home/operator/.local/bin            0755 operator operator -
L+ /var/home/operator/.local/bin/gnome-kiosk-script - - - - /usr/libexec/edge-demo/kiosk-launch
d  /var/lib/AccountsService/users           0700 root root -
f+ /var/lib/AccountsService/users/operator  0600 root root - [User]\nSession=gnome-kiosk-script-wayland\nXSession=gnome-kiosk-script-wayland\nSystemAccount=false\n
