# Operator home + kiosk wiring. Re-applied every boot, so after a role
# switch the kiosk script points at the new image's launcher.
d  /var/home/edgeop                       0700 edgeop edgeop -
d  /var/home/edgeop/.local                0755 edgeop edgeop -
d  /var/home/edgeop/.local/bin            0755 edgeop edgeop -
L+ /var/home/edgeop/.local/bin/gnome-kiosk-script - - - - /usr/libexec/edge-demo/kiosk-launch
d  /var/lib/AccountsService/users           0700 root root -
f+ /var/lib/AccountsService/users/edgeop  0600 root root - [User]\nSession=gnome-kiosk-script-wayland\nXSession=gnome-kiosk-script-wayland\nSystemAccount=false\n
