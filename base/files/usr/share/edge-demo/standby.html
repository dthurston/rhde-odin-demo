<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edge Node Standby</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090a; color: #c9d1cc;
    font-family: "Red Hat Display", "Red Hat Text", "Noto Sans", sans-serif; overflow: hidden; }
  .wrap { height: 100%; display: grid; place-items: center; text-align: center; }
  .ring { width: 220px; height: 220px; border-radius: 50%; margin: 0 auto 40px;
    border: 2px solid #1f2a25; position: relative; }
  .ring::after { content: ""; position: absolute; inset: -2px; border-radius: 50%;
    border: 2px solid transparent; border-top-color: #ee0000; animation: spin 2.4s linear infinite; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 15px; letter-spacing: .3em; color: #6f7d76; }
  h1 { font-weight: 500; letter-spacing: .28em; font-size: 28px; margin: 0 0 12px; color: #e8ece9; }
  p  { margin: 0; letter-spacing: .18em; font-size: 14px; color: #6f7d76; }
  .brand { position: fixed; bottom: 28px; left: 0; right: 0; text-align: center;
    font-size: 13px; letter-spacing: .2em; color: #4b5651; }
  .brand b { color: #ee0000; font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="ring"><span>STANDBY</span></div>
    <h1>EDGE NODE READY</h1>
    <p>AWAITING MISSION ROLE ASSIGNMENT</p>
  </div>
</div>
<div class="brand"><b>RED HAT</b> DEVICE EDGE &nbsp;·&nbsp; IMAGE MODE</div>
</body>
</html>
